&lt;section id=&quot;work&quot; class=&quot;work wrap&quot; aria-labelledby=&quot;work-title&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;h2 id=&quot;work-title&quot; data-i18n=&quot;workTitle&quot;&gt;Selected work.&lt;br&gt;Concrete ideas.&lt;/h2&gt;&lt;p data-i18n=&quot;workIntro&quot;&gt;Start with a public web app and an interactive project with inspectable source, then explore the prototypes. Each case describes my contribution and the current boundaries.&lt;/p&gt;&lt;/div&gt;
&lt;article class=&quot;case nami-case&quot; id=&quot;nami&quot;&gt;&lt;div class=&quot;case-heading&quot;&gt;&lt;h3&gt;Ñami&lt;/h3&gt;&lt;p class=&quot;case-kind&quot; data-i18n=&quot;namiKind&quot;&gt;Meal planning for Chile · Web app&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span data-i18n=&quot;namiTagPlan&quot;&gt;Weekly planning&lt;/span&gt;&lt;span data-i18n=&quot;namiTagRecipes&quot;&gt;Recipes&lt;/span&gt;&lt;span data-i18n=&quot;namiTagList&quot;&gt;Shopping lists&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;case-body&quot;&gt;&lt;p class=&quot;case-lede&quot; data-i18n=&quot;namiLede&quot;&gt;A week of meals, planned around everyday life.&lt;/p&gt;&lt;p data-i18n=&quot;namiBody&quot;&gt;A Spanish-language meal-planning web app for Chile, connecting weekly menus, recipes and organized shopping lists in a mobile-first experience.&lt;/p&gt;&lt;p data-i18n=&quot;namiContribution&quot;&gt;Built with AI assistance, with my focus on product direction, requirements and iterative UX feedback.&lt;/p&gt;&lt;a class=&quot;text-link nami-link&quot; href=&quot;https://mealprep-xi-six.vercel.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;&lt;span data-i18n=&quot;namiVisit&quot;&gt;Explore Ñami&lt;/span&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M7 17 17 7M7 7h10v10&quot;/&gt;&lt;/svg&gt;&lt;/a&gt;&lt;details&gt;&lt;summary&gt;&lt;span data-i18n=&quot;decisions&quot;&gt;Decisions &amp;amp; boundaries&lt;/span&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14m-7-7v14&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;div class=&quot;case-details&quot;&gt;&lt;h4 data-i18n=&quot;decisionTitle&quot;&gt;The product decision&lt;/h4&gt;&lt;p data-i18n=&quot;namiDecision&quot;&gt;Bring meal ideas, weekly planning and the shopping list into one flow, with attention to portions, preferences, pantry staples and phone-friendly navigation.&lt;/p&gt;&lt;h4 data-i18n=&quot;currentTitle&quot;&gt;Current boundary&lt;/h4&gt;&lt;p data-i18n=&quot;namiBoundary&quot;&gt;The linked project is a web app. Its native iPhone app is marked coming soon. Fridge scanning and checkout are not presented here as verified working integrations; prices are estimates.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;figure class=&quot;nami-visual&quot;&gt;&lt;a href=&quot;https://mealprep-xi-six.vercel.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; aria-label=&quot;Open the Ñami meal-planning web app&quot;&gt;&lt;img src=&quot;assets/nami-preview.jpg&quot; alt=&quot;Ñami public homepage with recipe discovery, weekly planning navigation and a prepared meal.&quot; width=&quot;1165&quot; height=&quot;747&quot; loading=&quot;lazy&quot;&gt;&lt;/a&gt;&lt;figcaption data-i18n=&quot;namiCaption&quot;&gt;Public web app · Spanish-language interface&lt;/figcaption&gt;&lt;/figure&gt;&lt;/article&gt;
&lt;article class=&quot;case city-case&quot; id=&quot;city-project&quot;&gt;&lt;div class=&quot;case-heading&quot;&gt;&lt;h3 data-i18n=&quot;cityProjectTitle&quot;&gt;Interactive portfolio city&lt;/h3&gt;&lt;p class=&quot;case-kind&quot; data-i18n=&quot;cityProjectKind&quot;&gt;Browser experience · Public source&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span&gt;JavaScript&lt;/span&gt;&lt;span&gt;Canvas 2D&lt;/span&gt;&lt;span&gt;Node.js&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;case-body&quot;&gt;&lt;p class=&quot;case-lede&quot; data-i18n=&quot;cityProjectLede&quot;&gt;A working interface you can explore and inspect.&lt;/p&gt;&lt;p data-i18n=&quot;cityProjectBody&quot;&gt;A night city rendered in the browser, with orbit, pan and zoom controls, selectable buildings and simulated traffic. Keyboard controls, touch exploration and reduced-motion support keep the experience usable beyond a mouse.&lt;/p&gt;&lt;p data-i18n=&quot;cityProjectContribution&quot;&gt;I shaped the visual direction, interaction requirements and iterative feedback. Implementation and test preparation are AI-assisted; the public source makes that work inspectable.&lt;/p&gt;&lt;p data-i18n=&quot;cityProjectTests&quot;&gt;The automated tests cover camera bounds, keyboard controls, touch gestures, reduced motion and pausing when the scene is hidden. The workflow roles are illustrative, not live agent telemetry.&lt;/p&gt;&lt;div class=&quot;proof-links&quot;&gt;&lt;a class=&quot;text-link&quot; href=&quot;#workflow-city&quot; data-i18n=&quot;cityProjectExplore&quot;&gt;Explore the city&lt;/a&gt;&lt;a class=&quot;text-link&quot; href=&quot;https://github.com/b4rzY/tbarzej/blob/main/src/city.js&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; data-i18n=&quot;cityProjectSource&quot;&gt;Read the implementation&lt;/a&gt;&lt;a class=&quot;text-link&quot; href=&quot;https://github.com/b4rzY/tbarzej/blob/main/tests/city.test.mjs&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; data-i18n=&quot;cityProjectTestLink&quot;&gt;Inspect the tests&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
&lt;div class=&quot;exhibit&quot; aria-label=&quot;Featured project preview&quot;&gt;
&lt;div class=&quot;exhibit-controls&quot;&gt;&lt;div class=&quot;project-switch&quot; role=&quot;tablist&quot; aria-label=&quot;Featured projects&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tab-workspace&quot; aria-controls=&quot;featured-panel&quot; aria-selected=&quot;true&quot; data-project=&quot;workspace&quot; data-i18n=&quot;tabWorkspace&quot;&gt;Spatial workspace&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tab-location&quot; aria-controls=&quot;featured-panel&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot; data-project=&quot;location&quot; data-i18n=&quot;tabLocation&quot;&gt;Finding interface&lt;/button&gt;&lt;/div&gt;&lt;span class=&quot;exhibit-type&quot; data-i18n=&quot;actualCapture&quot;&gt;Project preview&lt;/span&gt;&lt;/div&gt;
&lt;div id=&quot;featured-panel&quot; class=&quot;featured-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-workspace&quot; tabindex=&quot;0&quot;&gt;&lt;img id=&quot;featured-image&quot; src=&quot;assets/workspace-study.svg&quot; width=&quot;1400&quot; height=&quot;900&quot; alt=&quot;Concept diagram of projects, time logs and report drafts in a spatial workspace.&quot;&gt;&lt;div class=&quot;capture-label&quot;&gt;&lt;span class=&quot;live-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span id=&quot;capture-caption&quot; data-i18n=&quot;workspaceCapture&quot;&gt;Concept diagram. No live integrations.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;exhibit-bottom&quot;&gt;&lt;p id=&quot;exhibit-description&quot; data-i18n=&quot;workspaceExhibit&quot;&gt;A spatial way to explore projects, manual time logs and report drafts.&lt;/p&gt;&lt;a id=&quot;exhibit-link&quot; href=&quot;#spatial-workspace&quot; class=&quot;text-link&quot;&gt;&lt;span data-i18n=&quot;readCase&quot;&gt;Read the case study&lt;/span&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14m-6-6 6 6-6 6&quot;/&gt;&lt;/svg&gt;&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;article class=&quot;case&quot; id=&quot;spatial-workspace&quot;&gt;&lt;div class=&quot;case-heading&quot;&gt;&lt;h3 data-i18n=&quot;spatialTitle&quot;&gt;Spatial work dashboard&lt;/h3&gt;&lt;p class=&quot;case-kind&quot; data-i18n=&quot;spatialKind&quot;&gt;Interactive workspace · Prototype&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span&gt;JavaScript&lt;/span&gt;&lt;span&gt;Canvas&lt;/span&gt;&lt;span data-i18n=&quot;tagLocal&quot;&gt;Local state&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;case-body&quot;&gt;&lt;p class=&quot;case-lede&quot; data-i18n=&quot;spatialLede&quot;&gt;What if organizing work felt more like navigating a place?&lt;/p&gt;&lt;p data-i18n=&quot;spatialBody&quot;&gt;An isometric city brings project templates, manual time entries and report drafts into one interface. The canvas supports orbit, zoom and a reset view, while conventional lists keep the same work accessible.&lt;/p&gt;&lt;details&gt;&lt;summary&gt;&lt;span data-i18n=&quot;decisions&quot;&gt;Decisions &amp; boundaries&lt;/span&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14m-7-7v14&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;div class=&quot;case-details&quot;&gt;&lt;h4 data-i18n=&quot;decisionTitle&quot;&gt;The product decision&lt;/h4&gt;&lt;p data-i18n=&quot;spatialDecision&quot;&gt;Use the city as another way into the work, while retaining lists and direct controls. Keep time entries manual rather than presenting guesses as recorded work.&lt;/p&gt;&lt;h4 data-i18n=&quot;currentTitle&quot;&gt;Current boundary&lt;/h4&gt;&lt;p data-i18n=&quot;spatialBoundary&quot;&gt;The visible projects and activity are examples. The prototype does not show live agents or connected workplace activity.&lt;/p&gt;&lt;h4 data-i18n=&quot;contributionTitle&quot;&gt;Contribution&lt;/h4&gt;&lt;p data-i18n=&quot;spatialContribution&quot;&gt;Product direction, visual reference selection, requirements and iterative feedback; implementation developed with AI assistance.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;case&quot; id=&quot;learning-playground&quot;&gt;&lt;div class=&quot;case-heading&quot;&gt;&lt;h3 data-i18n=&quot;learningTitle&quot;&gt;Learning playground&lt;/h3&gt;&lt;p class=&quot;case-kind&quot; data-i18n=&quot;learningKind&quot;&gt;Language practice · Prototype&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span&gt;JavaScript&lt;/span&gt;&lt;span&gt;Web Audio&lt;/span&gt;&lt;span&gt;Node.js&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;case-body&quot;&gt;&lt;p class=&quot;case-lede&quot; data-i18n=&quot;learningLede&quot;&gt;Start with curiosity. Make language practice part of the conversation.&lt;/p&gt;&lt;p data-i18n=&quot;learningBody&quot;&gt;A learning concept combines topic selection, adjustable correction styles and session recaps with an original melody and a tap-timing activity.&lt;/p&gt;&lt;div class=&quot;learning-excerpt&quot; aria-label=&quot;Learning prototype concept&quot;&gt;&lt;div class=&quot;excerpt-line&quot;&gt;&lt;span class=&quot;excerpt-label&quot; data-i18n=&quot;excerptSubject&quot;&gt;Choose a subject&lt;/span&gt;&lt;span data-i18n=&quot;excerptTopic&quot;&gt;Math&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;excerpt-line&quot;&gt;&lt;span class=&quot;excerpt-label&quot; data-i18n=&quot;excerptStyle&quot;&gt;Correction style&lt;/span&gt;&lt;span data-i18n=&quot;excerptCoach&quot;&gt;Coach as we go&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;excerpt-quote&quot; data-i18n=&quot;excerptQuote&quot;&gt;“I am agree.”&lt;/p&gt;&lt;div class=&quot;excerpt-note&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;m5 12 4 4L19 6&quot;/&gt;&lt;/svg&gt;&lt;span data-i18n=&quot;excerptCorrection&quot;&gt;Try “I agree.”&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;excerpt-caption&quot; data-i18n=&quot;excerptCaption&quot;&gt;Illustrative excerpt from a deterministic correction rule, not a live AI response.&lt;/p&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;&lt;span data-i18n=&quot;decisions&quot;&gt;Decisions &amp; boundaries&lt;/span&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14m-7-7v14&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;div class=&quot;case-details&quot;&gt;&lt;h4 data-i18n=&quot;decisionTitle&quot;&gt;The product decision&lt;/h4&gt;&lt;p data-i18n=&quot;learningDecision&quot;&gt;Let the learner choose the subject and how often to receive corrections. Keep conversation, learning and music in one coherent product rather than separate utilities.&lt;/p&gt;&lt;h4 data-i18n=&quot;currentTitle&quot;&gt;Current boundary&lt;/h4&gt;&lt;p data-i18n=&quot;learningBoundary&quot;&gt;Conversations are scripted and correction rules are limited. No AI model, microphone, speech recognition, pronunciation scoring or vocal-pitch assessment is connected. The rhythm activity measures taps only.&lt;/p&gt;&lt;h4 data-i18n=&quot;contributionTitle&quot;&gt;Contribution&lt;/h4&gt;&lt;p data-i18n=&quot;learningContribution&quot;&gt;Original product concept, learning experience requirements and iteration priorities; AI-assisted interface, implementation and test preparation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;case&quot; id=&quot;finding-interface&quot;&gt;&lt;div class=&quot;case-heading&quot;&gt;&lt;h3 data-i18n=&quot;findingTitle&quot;&gt;Cat-finding interface&lt;/h3&gt;&lt;p class=&quot;case-kind&quot; data-i18n=&quot;findingKind&quot;&gt;Spatial guidance · Simulation&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span&gt;JavaScript&lt;/span&gt;&lt;span data-i18n=&quot;tagGeometry&quot;&gt;Geometry&lt;/span&gt;&lt;span data-i18n=&quot;tagCamera&quot;&gt;Camera lifecycle&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;case-body&quot;&gt;&lt;p class=&quot;case-lede&quot; data-i18n=&quot;findingLede&quot;&gt;Explore the finding experience before connecting the hardware.&lt;/p&gt;&lt;p data-i18n=&quot;findingBody&quot;&gt;A direction-and-distance prototype uses a virtual target and manual heading to explore nearby, behind-you and further-away states. An optional camera background lets the interface be considered in context.&lt;/p&gt;&lt;details&gt;&lt;summary&gt;&lt;span data-i18n=&quot;decisions&quot;&gt;Decisions &amp; boundaries&lt;/span&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14m-7-7v14&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;div class=&quot;case-details&quot;&gt;&lt;h4 data-i18n=&quot;decisionTitle&quot;&gt;The product decision&lt;/h4&gt;&lt;p data-i18n=&quot;findingDecision&quot;&gt;Separate interaction design from uncertain hardware access. Make simulated values unmistakable and preserve usable controls when the camera is unavailable.&lt;/p&gt;&lt;h4 data-i18n=&quot;currentTitle&quot;&gt;Current boundary&lt;/h4&gt;&lt;p data-i18n=&quot;findingBoundary&quot;&gt;There is no live AirTag, GPS, Bluetooth or Ultra Wideband connection. The marker is not spatially anchored. This is an interface simulation, not a tracker or a safety device.&lt;/p&gt;&lt;h4 data-i18n=&quot;contributionTitle&quot;&gt;Contribution&lt;/h4&gt;&lt;p data-i18n=&quot;findingContribution&quot;&gt;Problem definition, desired finding experience and hardware questions; AI-assisted simulation, interface and test planning.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/article&gt;
&lt;div class=&quot;further-work&quot;&gt;&lt;h3 data-i18n=&quot;furtherTitle&quot;&gt;Beyond prototypes&lt;/h3&gt;&lt;div class=&quot;further-row&quot;&gt;&lt;h4 data-i18n=&quot;venueTitle&quot;&gt;Venue planning&lt;/h4&gt;&lt;p data-i18n=&quot;venueBody&quot;&gt;Calendar-driven business modeling, scenario comparisons and role-based views. The underlying project uses TypeScript, Vite and Supabase. Private business data and source are omitted here.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;further-row&quot;&gt;&lt;h4 data-i18n=&quot;clientTitle&quot;&gt;Client websites &amp; operations&lt;/h4&gt;&lt;p data-i18n=&quot;clientBody&quot;&gt;Company and venue websites, bilingual presentation and event administration workflows. Product requirements and repeated UX feedback center on making everyday tasks easier.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;focus wrap&quot; id=&quot;focus&quot;&gt;&lt;div class=&quot;focus-heading&quot;&gt;&lt;h2 data-i18n=&quot;focusTitle&quot;&gt;How I work.&lt;br&gt;From idea to interface.&lt;/h2&gt;&lt;p data-i18n=&quot;focusIntro&quot;&gt;Three connected parts of the way I work.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;focus-list&quot;&gt;&lt;article&gt;&lt;div class=&quot;focus-icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;6&quot; y=&quot;6&quot; width=&quot;12&quot; height=&quot;12&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M9 1v5m6-5v5M9 18v5m6-5v5M1 9h5m-5 6h5m12-6h5m-5 6h5&quot;/&gt;&lt;path d=&quot;M10 10h4v4h-4z&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;h3 data-i18n=&quot;focusReverseTitle&quot;&gt;Reverse engineering&lt;/h3&gt;&lt;p data-i18n=&quot;focusReverse&quot;&gt;Independent study of software behavior, internal structures and real-time data. Private research and source code stay private.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;div class=&quot;focus-icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;m7 7-5 5 5 5m10-10 5 5-5 5m-3-14-4 18&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;h3 data-i18n=&quot;focusProgrammingTitle&quot;&gt;Programming&lt;/h3&gt;&lt;p data-i18n=&quot;focusProgramming&quot;&gt;Web interfaces, visualizations, audio experiments and practical tools, with an emphasis on understandable behavior and useful controls.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;div class=&quot;focus-icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;m12 2 10 5-10 5L2 7l10-5Zm-10 10 10 5 10-5M2 17l10 5 10-5&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;h3 data-i18n=&quot;focusProductTitle&quot;&gt;Product development&lt;/h3&gt;&lt;p data-i18n=&quot;focusProduct&quot;&gt;Defining requirements, shaping the experience, evaluating results and iterating with AI-assisted engineering.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;approach&quot; class=&quot;approach&quot;&gt;&lt;div class=&quot;wrap approach-grid&quot;&gt;&lt;h2 data-i18n=&quot;approachTitle&quot;&gt;A clear idea.&lt;br&gt;A testable next step.&lt;/h2&gt;&lt;div&gt;&lt;p class=&quot;approach-intro&quot; data-i18n=&quot;approachIntro&quot;&gt;I work with AI throughout the build process. My contribution includes product ideas, requirements, design direction, feedback and iteration. Implementation and test preparation are AI-assisted.&lt;/p&gt;&lt;dl&gt;&lt;div&gt;&lt;dt data-i18n=&quot;approach1Title&quot;&gt;Define the useful thing&lt;/dt&gt;&lt;dd data-i18n=&quot;approach1&quot;&gt;Turn an idea into concrete interactions, constraints and examples that can be evaluated.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt data-i18n=&quot;approach2Title&quot;&gt;Build, inspect, refine&lt;/dt&gt;&lt;dd data-i18n=&quot;approach2&quot;&gt;Work with AI on implementation, then use feedback and visible behavior to guide the next iteration.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt data-i18n=&quot;approach3Title&quot;&gt;Keep the boundaries clear&lt;/dt&gt;&lt;dd data-i18n=&quot;approach3&quot;&gt;Distinguish sample data, simulations and future capabilities from what a prototype actually does today.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;workflow-city&quot; class=&quot;workflow-city wrap&quot; aria-labelledby=&quot;workflow-city-title&quot;&gt;
