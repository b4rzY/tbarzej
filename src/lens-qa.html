<!doctype html><html><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width"><title>Temporary responsive lens check</title><body style="background:#222;color:white;font:16px sans-serif"><button id="touch">Simulate touch</button> <button id="cancel">Simulate touch cancellation</button><pre id="result">Loading mobile-width frame</pre><iframe id="site" src="/" style="width:390px;height:760px;border:0"></iframe><script>
const frame=document.querySelector('iframe');function result(){const d=frame.contentDocument;document.querySelector('pre').textContent=JSON.stringify({width:frame.contentWindow.innerWidth,overflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth,svgFilters:d.querySelectorAll('filter[id^=gravity]').length,shifted:[...d.querySelectorAll('h1,h2,h3,p')].filter(e=>e.style.transform).length,duplicateCursor:d.querySelectorAll('.gravity-horizon').length});}frame.onload=()=>setTimeout(result,600);touch.onclick=()=>{frame.contentWindow.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown',{clientX:180,clientY:230,pointerType:'touch',bubbles:true}));setTimeout(result,100);};cancel.onclick=()=>{frame.contentWindow.dispatchEvent(new frame.contentWindow.PointerEvent('pointercancel',{pointerType:'touch',bubbles:true}));setTimeout(result,100);};
</script></body></html>
